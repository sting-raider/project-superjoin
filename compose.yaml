services:
  project-superjoin:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DATABASE_PATH: /app/data/project_superjoin.sqlite3
      UPLOAD_DIR: /app/data/uploads
      DEMO_MODE: ${DEMO_MODE:-true}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      EXTRACTION_BASE_URL: ${EXTRACTION_BASE_URL:-}
      EXTRACTION_API_KEY: ${EXTRACTION_API_KEY:-}
      REASONING_BASE_URL: ${REASONING_BASE_URL:-}
      REASONING_API_KEY: ${REASONING_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gemini-3.5-flash-lite}
      REASONING_MODEL: ${REASONING_MODEL:-gemini-3.8-flash}
      VISION_MODEL: ${VISION_MODEL:-gemini-3.8-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      EXTRACTION_MAX_OUTPUT_TOKENS: ${EXTRACTION_MAX_OUTPUT_TOKENS:-1200}
      REASONING_MAX_OUTPUT_TOKENS: ${REASONING_MAX_OUTPUT_TOKENS:-1200}
      VISION_MAX_OUTPUT_TOKENS: ${VISION_MAX_OUTPUT_TOKENS:-1200}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-2}
      REASONING_CONCURRENCY: ${REASONING_CONCURRENCY:-2}
      VISION_CONCURRENCY: ${VISION_CONCURRENCY:-2}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-2}
      EXTRACTION_STRUCTURED_OUTPUT_MODE: ${EXTRACTION_STRUCTURED_OUTPUT_MODE:-json_object}
      REASONING_STRUCTURED_OUTPUT_MODE: ${REASONING_STRUCTURED_OUTPUT_MODE:-json_object}
      VISION_STRUCTURED_OUTPUT_MODE: ${VISION_STRUCTURED_OUTPUT_MODE:-json_object}
      EMBEDDING_TASK_TYPE: ${EMBEDDING_TASK_TYPE:-retrieval_document}
      AI_BUDGET_USD: ${AI_BUDGET_USD:-20}
    volumes:
      - project_superjoin_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  project_superjoin_data:
