services:
  project-superjoin:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DATABASE_PATH: /app/data/project_superjoin.sqlite3
      UPLOAD_DIR: /app/data/uploads
      DEMO_MODE: ${DEMO_MODE:-true}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      EXTRACTION_BASE_URL: ${EXTRACTION_BASE_URL:-}
      EXTRACTION_API_KEY: ${EXTRACTION_API_KEY:-}
      REASONING_BASE_URL: ${REASONING_BASE_URL:-}
      REASONING_API_KEY: ${REASONING_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      REASONING_MODEL: ${REASONING_MODEL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_INCLUDE_DIMENSIONS: ${EMBEDDING_INCLUDE_DIMENSIONS:-true}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      AI_INPUT_PRICE_PER_MILLION: ${AI_INPUT_PRICE_PER_MILLION:-0.35}
      AI_OUTPUT_PRICE_PER_MILLION: ${AI_OUTPUT_PRICE_PER_MILLION:-0.53}
      EXTRACTION_TIMEOUT_SECONDS: ${EXTRACTION_TIMEOUT_SECONDS:-90}
      REASONING_TIMEOUT_SECONDS: ${REASONING_TIMEOUT_SECONDS:-90}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-90}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-90}
      EXTRACTION_MAX_OUTPUT_TOKENS: ${EXTRACTION_MAX_OUTPUT_TOKENS:-1200}
      REASONING_MAX_OUTPUT_TOKENS: ${REASONING_MAX_OUTPUT_TOKENS:-1200}
      VISION_MAX_OUTPUT_TOKENS: ${VISION_MAX_OUTPUT_TOKENS:-1200}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-2}
      EXTRACTION_BATCH_PAGES: ${EXTRACTION_BATCH_PAGES:-6}
      EXTRACTION_BATCH_CHARS: ${EXTRACTION_BATCH_CHARS:-24000}
      EXTRACTION_HINT_LIMIT: ${EXTRACTION_HINT_LIMIT:-24}
      EXTRACTION_CLAIMS_PER_BATCH: ${EXTRACTION_CLAIMS_PER_BATCH:-8}
      REASONING_CONCURRENCY: ${REASONING_CONCURRENCY:-2}
      RELATIONSHIP_CANDIDATE_LIMIT: ${RELATIONSHIP_CANDIDATE_LIMIT:-12}
      RELATIONSHIP_SEMANTIC_LIMIT: ${RELATIONSHIP_SEMANTIC_LIMIT:-24}
      VISION_CONCURRENCY: ${VISION_CONCURRENCY:-2}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-2}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-128}
      EXTRACTION_STRUCTURED_OUTPUT_MODE: ${EXTRACTION_STRUCTURED_OUTPUT_MODE:-json_object}
      REASONING_STRUCTURED_OUTPUT_MODE: ${REASONING_STRUCTURED_OUTPUT_MODE:-json_object}
      VISION_STRUCTURED_OUTPUT_MODE: ${VISION_STRUCTURED_OUTPUT_MODE:-json_object}
      EMBEDDING_TASK_TYPE: ${EMBEDDING_TASK_TYPE:-retrieval_document}
      EXTRACTION_CHAT_PATH: ${EXTRACTION_CHAT_PATH:-/chat/completions}
      REASONING_CHAT_PATH: ${REASONING_CHAT_PATH:-/chat/completions}
      VISION_CHAT_PATH: ${VISION_CHAT_PATH:-/chat/completions}
      EMBEDDING_PATH: ${EMBEDDING_PATH:-/embeddings}
      EXTRACTION_AUTH_HEADER: ${EXTRACTION_AUTH_HEADER:-Authorization}
      REASONING_AUTH_HEADER: ${REASONING_AUTH_HEADER:-Authorization}
      VISION_AUTH_HEADER: ${VISION_AUTH_HEADER:-Authorization}
      EMBEDDING_AUTH_HEADER: ${EMBEDDING_AUTH_HEADER:-Authorization}
      EXTRACTION_AUTH_SCHEME: ${EXTRACTION_AUTH_SCHEME:-Bearer}
      REASONING_AUTH_SCHEME: ${REASONING_AUTH_SCHEME:-Bearer}
      VISION_AUTH_SCHEME: ${VISION_AUTH_SCHEME:-Bearer}
      EMBEDDING_AUTH_SCHEME: ${EMBEDDING_AUTH_SCHEME:-Bearer}
      EXTRACTION_SEND_MODEL: ${EXTRACTION_SEND_MODEL:-true}
      REASONING_SEND_MODEL: ${REASONING_SEND_MODEL:-true}
      VISION_SEND_MODEL: ${VISION_SEND_MODEL:-true}
      EMBEDDING_SEND_MODEL: ${EMBEDDING_SEND_MODEL:-true}
      AI_RETRY_ATTEMPTS: ${AI_RETRY_ATTEMPTS:-2}
      AI_RETRY_BACKOFF_SECONDS: ${AI_RETRY_BACKOFF_SECONDS:-0.25}
      AI_BUDGET_USD: ${AI_BUDGET_USD:-20}
      MAX_PDF_MB: ${MAX_PDF_MB:-100}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-2000}
    volumes:
      - project_superjoin_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  project_superjoin_data:
